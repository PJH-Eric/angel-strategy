# Render Blueprint：只部署 WebSocket 伺服器；前端走 GitHub Pages。
services:
  - type: web
    name: angel-strategy-server
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: GAME_ALLOWED_ORIGIN
        sync: false   # 例如 https://你的帳號.github.io（可用逗號分隔多個前端網址）
